<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Vitalis healthcare appointment app screens">
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECFDF5"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
    <filter id="hsh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#064E3B" flood-opacity=".22"/></filter>
    <filter id="hsh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#064E3B" flood-opacity=".16"/></filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#hb)"/>
  <circle cx="230" cy="180" r="270" fill="#10B981" fill-opacity=".10"/>
  <circle cx="1400" cy="1010" r="330" fill="#0EA5E9" fill-opacity=".12"/>

  <text x="120" y="120" fill="#065F46" font-size="18" font-weight="700" letter-spacing="5">VITALIS · PATIENT APP</text>
  <text x="120" y="182" fill="#0A1233" font-size="54" font-weight="800" letter-spacing="-1">Booking a specialist</text>
  <text x="120" y="234" fill="#3F5570" font-size="24">reduced from 8 minutes to 52 seconds.</text>

  <!-- PHONE 1 -->
  <g transform="translate(190,300)" filter="url(#hsh)">
    <rect width="440" height="860" rx="66" fill="#0A1233"/>
    <rect x="14" y="14" width="412" height="832" rx="54" fill="#F7FBFD"/>
    <rect x="158" y="30" width="124" height="26" rx="13" fill="#0A1233"/>
    <text x="52" y="96" fill="#94A3B8" font-size="17">Good morning,</text>
    <text x="52" y="134" fill="#0A1233" font-size="30" font-weight="800">Hi, Amelia</text>
    <circle cx="372" cy="112" r="30" fill="url(#h2)"/><text x="372" y="121" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">A</text>

    <rect x="52" y="168" width="336" height="66" rx="33" fill="#fff"/>
    <circle cx="92" cy="201" r="11" fill="none" stroke="#94A3B8" stroke-width="4"/><path d="M100 209l10 10" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <text x="128" y="209" fill="#94A3B8" font-size="19">Search symptom or doctor</text>

    <rect x="52" y="258" width="336" height="150" rx="30" fill="url(#h1)"/>
    <text x="84" y="304" fill="#ECFDF5" font-size="16" font-weight="700" letter-spacing="2">NEXT APPOINTMENT</text>
    <text x="84" y="344" fill="#fff" font-size="27" font-weight="800">Dr. Elena Vasquez</text>
    <text x="84" y="376" fill="#D1FAE5" font-size="18">Today · 10:30 · Cardiology</text>
    <rect x="84" y="392" width="140" height="0" fill="none"/>
    <circle cx="348" cy="330" r="34" fill="#ffffff" fill-opacity=".22"/>
    <path d="M334 330l10 10 20-22" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="52" y="464" fill="#0A1233" font-size="23" font-weight="800">Available today</text>
    <text x="388" y="464" fill="#2563FF" font-size="17" font-weight="700" text-anchor="end">See all</text>

    <g>
      <rect x="52" y="488" width="336" height="112" rx="26" fill="#fff"/>
      <circle cx="110" cy="544" r="34" fill="#DBEAFE"/><circle cx="110" cy="534" r="13" fill="#2563FF"/><path d="M88 570c4-14 12-20 22-20s18 6 22 20z" fill="#2563FF"/>
      <text x="156" y="534" fill="#0A1233" font-size="19" font-weight="700">Dr. Marcus Bell</text>
      <text x="156" y="562" fill="#64748B" font-size="16">Dermatology · 4.9 ★</text>
      <rect x="304" y="516" width="68" height="40" rx="20" fill="#ECFEFF"/><text x="338" y="542" fill="#0891B2" font-size="15" font-weight="700" text-anchor="middle">14:00</text>
    </g>
    <g>
      <rect x="52" y="616" width="336" height="112" rx="26" fill="#fff"/>
      <circle cx="110" cy="672" r="34" fill="#F3E8FF"/><circle cx="110" cy="662" r="13" fill="#7C3AED"/><path d="M88 698c4-14 12-20 22-20s18 6 22 20z" fill="#7C3AED"/>
      <text x="156" y="662" fill="#0A1233" font-size="19" font-weight="700">Dr. Priya Nair</text>
      <text x="156" y="690" fill="#64748B" font-size="16">Neurology · 4.8 ★</text>
      <rect x="304" y="644" width="68" height="40" rx="20" fill="#F5F3FF"/><text x="338" y="670" fill="#7C3AED" font-size="15" font-weight="700" text-anchor="middle">16:30</text>
    </g>

    <rect x="52" y="752" width="336" height="72" rx="36" fill="#0A1233"/>
    <g fill="#5D6BA6"><circle cx="116" cy="788" r="9"/><circle cx="196" cy="788" r="9"/><circle cx="324" cy="788" r="9"/></g>
    <circle cx="260" cy="788" r="9" fill="#22D3EE"/>
    <rect x="88" y="768" width="56" height="40" rx="20" fill="#1B2557"/>
    <text x="116" y="795" fill="#22D3EE" font-size="19" text-anchor="middle">⌂</text>
  </g>

  <!-- PHONE 2 -->
  <g transform="translate(700,360)" filter="url(#hsh)">
    <rect width="440" height="800" rx="66" fill="#0A1233"/>
    <rect x="14" y="14" width="412" height="772" rx="54" fill="#fff"/>
    <rect x="158" y="30" width="124" height="26" rx="13" fill="#0A1233"/>
    <path d="M74 116l-22 22 22 22" stroke="#0A1233" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="146" fill="#0A1233" font-size="25" font-weight="800" text-anchor="middle">Choose a slot</text>

    <g font-size="17" fill="#64748B" text-anchor="middle">
      <text x="86" y="204">M</text><text x="144" y="204">T</text><text x="202" y="204">W</text><text x="260" y="204">T</text><text x="318" y="204">F</text><text x="376" y="204">S</text>
    </g>
    <g font-size="21" font-weight="700" fill="#0A1233" text-anchor="middle">
      <text x="86" y="252">9</text><text x="144" y="252">10</text><text x="202" y="252">11</text><text x="260" y="252">12</text><text x="318" y="252">13</text><text x="376" y="252" fill="#CBD5E1">14</text>
    </g>
    <rect x="174" y="216" width="56" height="56" rx="20" fill="url(#h2)"/>
    <text x="202" y="252" fill="#fff" font-size="21" font-weight="800" text-anchor="middle">11</text>

    <text x="52" y="330" fill="#0A1233" font-size="23" font-weight="800">Morning</text>
    <g font-size="19" font-weight="700" text-anchor="middle">
      <rect x="52" y="354" width="102" height="58" rx="20" fill="#F1F5F9"/><text x="103" y="391" fill="#64748B">08:30</text>
      <rect x="169" y="354" width="102" height="58" rx="20" fill="#0A1233"/><text x="220" y="391" fill="#fff">10:30</text>
      <rect x="286" y="354" width="102" height="58" rx="20" fill="#F1F5F9"/><text x="337" y="391" fill="#64748B">11:15</text>
    </g>

    <text x="52" y="470" fill="#0A1233" font-size="23" font-weight="800">Afternoon</text>
    <g font-size="19" font-weight="700" text-anchor="middle">
      <rect x="52" y="494" width="102" height="58" rx="20" fill="#F1F5F9"/><text x="103" y="531" fill="#64748B">13:00</text>
      <rect x="169" y="494" width="102" height="58" rx="20" fill="#F1F5F9"/><text x="220" y="531" fill="#64748B">15:45</text>
      <rect x="286" y="494" width="102" height="58" rx="20" fill="#ECFEFF"/><text x="337" y="531" fill="#0891B2">16:30</text>
    </g>

    <rect x="52" y="588" width="336" height="104" rx="26" fill="#ECFDF5"/>
    <circle cx="104" cy="640" r="26" fill="#10B981"/><path d="M92 640l9 9 17-19" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="148" y="632" fill="#065F46" font-size="20" font-weight="800">Video visit</text>
    <text x="148" y="660" fill="#047857" font-size="17">Link sent after confirmation</text>

    <rect x="52" y="708" width="336" height="62" rx="31" fill="url(#h1)"/>
    <text x="220" y="747" fill="#fff" font-size="21" font-weight="800" text-anchor="middle">Confirm booking</text>
  </g>

  <!-- floating confirmation card -->
  <g transform="translate(1156,430)" filter="url(#hsh2)">
    <rect width="340" height="200" rx="30" fill="#fff"/>
    <circle cx="76" cy="76" r="34" fill="#DCFCE7"/><path d="M62 76l10 10 20-22" stroke="#16A34A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="70" fill="#0A1233" font-size="24" font-weight="800">Appointment</text>
    <text x="132" y="102" fill="#0A1233" font-size="24" font-weight="800">confirmed</text>
    <rect x="40" y="132" width="260" height="46" rx="23" fill="#F1F5F9"/>
    <text x="170" y="162" fill="#475569" font-size="18" font-weight="700" text-anchor="middle">Tue 11 · 10:30 · Dr. Vasquez</text>
  </g>

  <!-- floating stat chips -->
  <g transform="translate(1156,690)" filter="url(#hsh2)">
    <rect width="340" height="150" rx="30" fill="#0A1233"/>
    <text x="40" y="66" fill="#22D3EE" font-size="52" font-weight="800">−22%</text>
    <text x="40" y="104" fill="#8FA0C9" font-size="19">no-show rate across 40 clinics</text>
  </g>

  <g transform="translate(1156,886)" filter="url(#hsh2)">
    <rect width="340" height="150" rx="30" fill="#fff"/>
    <text x="40" y="66" fill="#2563FF" font-size="52" font-weight="800">4.9★</text>
    <text x="40" y="104" fill="#64748B" font-size="19">App Store rating · 12k reviews</text>
  </g>

  <g transform="translate(116,346)" filter="url(#hsh2)">
    <rect width="300" height="96" rx="26" fill="#fff"/>
    <circle cx="52" cy="48" r="24" fill="#DBEAFE"/><circle cx="52" cy="42" r="9" fill="#2563FF"/><path d="M37 64c3-10 8-14 15-14s12 4 15 14z" fill="#2563FF"/>
    <text x="92" y="42" fill="#0A1233" font-size="19" font-weight="700">40+ clinics</text>
    <text x="92" y="68" fill="#64748B" font-size="16">connected nationwide</text>
  </g>
</svg>
